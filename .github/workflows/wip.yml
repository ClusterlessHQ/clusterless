name: Clusterless Wip Build
run-name: "Push: from ${{ github.actor }}"
on:
  workflow_dispatch:
  push:
    branches:
      - 'wip-*'
      - '!*-scenarios'
    paths-ignore:
      - '**.txt'
      - '**.md'
      - '**.adoc'
      - '**.template'
      - '**.hbs'
jobs:
  # every wip-* branch (e.g. wip-1.0-aug) runs the unit and integration tests
  test:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publish.outputs.publish }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - name: Install Node
        uses: actions/setup-node@v7

      - name: Install CDK
        run: npm install -g aws-cdk@2.1100.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Env
        run: echo "${{ vars.GRADLE_PROPERTIES }}" > gradle.properties

      # only the version branch (wip-<clusterless.release.major>) publishes; it is the
      # same branch jreleaser releases from (versionBranch in the common conventions)
      - name: Resolve Publish Branch
        id: publish
        run: |
          major=$(sed -n 's/^clusterless\.release\.major=//p' version.properties)
          if [ "${GITHUB_REF_NAME}" = "wip-${major}" ]; then publish=true; else publish=false; fi
          echo "branch=${GITHUB_REF_NAME} release-branch=wip-${major} publish=${publish}"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Run Tests
        env:
          LOCALSTACK_API_KEY: ${{ secrets.LOCALSTACK_API_KEY }}
        run: |
          ./gradlew --no-daemon --info --stacktrace check

  # only the version branch runs the AWS scenarios, then releases and deploys docs
  scenarios-and-release:
    needs: test
    if: needs.test.outputs.publish == 'true'
    concurrency: scenarios-us-west-2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - name: Install Node
        uses: actions/setup-node@v7

      - name: Install CDK
        run: npm install -g aws-cdk@2.1100.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Env
        run: echo "${{ vars.GRADLE_PROPERTIES }}" > gradle.properties

      - name: Run Scenarios
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
        run: |
          ./gradlew --no-daemon --info --stacktrace scenarios

      - name: Archive Scenario Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scenario-results
          path: |
            clusterless-scenario/build/scenarios/*
            !clusterless-scenario/build/scenarios/**/cdk.out
          retention-days: 5

      - name: Release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_HOMEBREW_GITHUB_TOKEN: ${{ secrets.JRELEASER_HOMEBREW_GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon --info --stacktrace release

      - name: Trigger Netlify Doc Deploy
        run: |
          curl -X POST -d '{}' https://api.netlify.com/build_hooks/67fe72e7760e879248fa36c4
